<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גיוס עובדים – אורקה טרייב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap">
<style>
/* faithful copy of the Elementor page (id 168), 25/09/2026 */
html,body{background:#010A17}
.orca-jobs{position:relative;direction:rtl;min-height:100vh;width:100%;box-sizing:border-box;overflow:hidden;background:#010A17;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2vw 0;font-family:"Assistant",assistant,sans-serif}
.orca-jobs *{box-sizing:border-box}
.orca-jobs__logo{width:6vw;max-width:6vw;padding:0 0 19vw;margin:0;position:relative;z-index:2}
.orca-jobs__logo img{display:block;width:100%;height:auto}
.orca-jobs__title{position:relative;z-index:2;margin:0;padding:0;font-family:inherit;font-size:3.3vw;font-weight:700;line-height:1.3em;color:#fff;text-align:center}
.orca-jobs__glow{position:absolute;top:4vw;height:calc(40vw + 3.3vw * 1.3);pointer-events:none}
.orca-jobs__glow--pink{width:79%;right:-47vw;transform:rotate(-23deg);background:radial-gradient(at center center,#E5008852 0%,#FFFFFF00 69%)}
.orca-jobs__glow--teal{width:56%;left:-31vw;transform:rotate(23deg);background:radial-gradient(at center center,#32E9DA4D -50%,#FFFFFF00 65%)}
@media (max-width:767px){
  .orca-jobs{z-index:2}
  .orca-jobs__logo{width:16vw;max-width:16vw;padding:6vw 0 51vw}
  .orca-jobs__title{font-size:8vw;padding-bottom:4vw}
  .orca-jobs__glow{z-index:1}
  .orca-jobs__glow--pink{width:100vw;top:50vw;right:-58vw;height:calc(97vw + 8vw * 1.3)}
  .orca-jobs__glow--teal{width:100vw;top:62vw;left:-60vw;height:calc(80vw + 8vw * 1.3)}
}
</style>
</head>
<body>
<main class="orca-jobs">
  <div class="orca-jobs__logo"><img src="https://www.orcatribe.co.il/wp-content/uploads/2026/03/Asset-1-1.svg" width="145" height="65" alt="אורקה טרייב"></div>
  <h1 class="orca-jobs__title">אנחנו מגייסים</h1>
  <div class="orca-jobs__glow orca-jobs__glow--pink" aria-hidden="true"></div>
  <div class="orca-jobs__glow orca-jobs__glow--teal" aria-hidden="true"></div>
</main>
</body>
</html>
